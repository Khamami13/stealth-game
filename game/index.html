<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Whisper Vault — a stealth game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0e12; }
  #game { position: fixed; inset: 0; margin: auto; width: 100%; height: 100%; object-fit: contain; display: block; touch-action: none; background: #0b0e12; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Whisper Vault: steal every lumen shard and reach the exit unseen, past wardens with lantern cones"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
